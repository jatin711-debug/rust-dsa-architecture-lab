name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path enterprise_backend/Cargo.toml -- --check
      - run: cargo clippy --manifest-path enterprise_backend/Cargo.toml --all-features --all-targets -- -D warnings
      - run: cargo test --manifest-path enterprise_backend/Cargo.toml
      - run: cargo test --manifest-path enterprise_backend/Cargo.toml --features db-integration --test db_integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise_backend/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: enterprise_backend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
